<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Geometry Dash (Game Boy)</title>
<style>
html,body{margin:0;height:100%;background:#111;color:#ddd;font:14px sans-serif;text-align:center}
canvas{image-rendering:pixelated;width:min(96vw,calc(80vh*160/144));aspect-ratio:160/144;background:#000;margin-top:2vh;touch-action:none}
#wrap:fullscreen{display:flex;align-items:center;justify-content:center;background:#000}
#wrap:fullscreen canvas{margin:0;width:min(100vw,calc(100vh*160/144))}
p{margin:.5em} a{color:#8af}
.btns button{font-size:18px;padding:.6em 1.2em;margin:.2em;border-radius:8px;border:1px solid #666;background:#222;color:#ddd;touch-action:none}
</style></head><body>
<div id="wrap"><canvas id="screen" width="160" height="144"></canvas></div>
<p class="btns"><button data-k="select">Select</button><button data-k="start">Start</button>
<button data-k="up">↑</button><button data-k="down">↓</button><button data-k="A">Jump (A)</button><button id="fs">Fullscreen</button></p>
<p id="msg">Loading…</p>
<p>Keys: Enter = Start · Space / Z / ↑ = Jump · ↑↓ = pick level · Shift = Select · F = fullscreen · tap the screen to jump · gamepads supported (A/B/X/Y = jump, d-pad/stick = menu, Start/Select)</p>
<p><a href="geometrydash.gb">Download ROM</a> · <a href="https://github.com/anderrh/geometrydash">Source</a> · emulator: <a href="https://github.com/binji/binjgb">binjgb</a> (MIT)</p>
<script src="binjgb.js"></script>
<script>
"use strict";
const TICKS_PER_SEC=4194304, AUDIO_FRAMES=4096, MAX_SEC=5/60;
const EV_FRAME=1, EV_AUDIO=2, EV_TICKS=4;
const ac=new (window.AudioContext||window.webkitAudioContext)();
const cv=document.getElementById('screen'), ctx=cv.getContext('2d'), img=ctx.createImageData(160,144);
const msg=document.getElementById('msg');
const keyMap={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',KeyZ:'A',Space:'A',KeyX:'B',Enter:'start',ShiftLeft:'select',ShiftRight:'select'};
(async()=>{
  try{
    const m=await Binjgb();
    const rom=new Uint8Array(await (await fetch('geometrydash.gb')).arrayBuffer());
    const size=(rom.length+0x7fff)&~0x7fff;
    const ptr=m._malloc(size);
    new Uint8Array(m.HEAP8.buffer,ptr,size).fill(0).set(rom);
    const e=m._emulator_new_simple(ptr,size,ac.sampleRate,AUDIO_FRAMES,2);
    if(!e) throw new Error('Invalid ROM');
    m._emulator_set_default_joypad_callback(e,m._joypad_new()); // route set_joyp_* into the emulated P1 register
    const fb=new Uint8Array(m.HEAP8.buffer,m._get_frame_buffer_ptr(e),m._get_frame_buffer_size(e));
    const ab=new Uint8Array(m.HEAP8.buffer,m._get_audio_buffer_ptr(e),m._get_audio_buffer_capacity(e));
    const KEYS=['up','down','left','right','A','B','select','start'];
    const src={kb:{},touch:{},pad:{}}, cur={};
    const apply=()=>{for(const k of KEYS){const v=!!(src.kb[k]||src.touch[k]||src.pad[k]); if(cur[k]!==v){cur[k]=v;m['_set_joyp_'+k](e,v?1:0);}}};
    const wrap=document.getElementById('wrap');
    const toggleFS=()=>{ if(document.fullscreenElement||document.webkitFullscreenElement){(document.exitFullscreen||document.webkitExitFullscreen).call(document);}
      else{(wrap.requestFullscreen||wrap.webkitRequestFullscreen).call(wrap);} };
    document.getElementById('fs').addEventListener('click',toggleFS);
    addEventListener('keydown',ev=>{ac.resume(); if(ev.code==='KeyF'&&!ev.repeat){toggleFS();ev.preventDefault();return;}
      const k=keyMap[ev.code];if(k){src.kb[k]=1;apply();ev.preventDefault();}});
    addEventListener('keyup',ev=>{const k=keyMap[ev.code];if(k){src.kb[k]=0;apply();ev.preventDefault();}});
    cv.addEventListener('dblclick',toggleFS);
    cv.addEventListener('pointerdown',ev=>{ac.resume();src.touch.A=1;apply();ev.preventDefault();});
    addEventListener('pointerup',()=>{src.touch.A=0;apply();});
    document.querySelectorAll('[data-k]').forEach(b=>{const k=b.dataset.k;
      b.addEventListener('pointerdown',ev=>{ac.resume();src.touch[k]=1;apply();ev.preventDefault();});
      const up=()=>{src.touch[k]=0;apply();}; b.addEventListener('pointerup',up); b.addEventListener('pointerleave',up);});
    const pollPad=()=>{
      const p={}, pads=navigator.getGamepads?navigator.getGamepads():[];
      for(const g of pads){ if(!g||!g.connected) continue; const B=i=>g.buttons[i]&&g.buttons[i].pressed;
        if(B(0)||B(1)||B(2)||B(3)||B(4)||B(5)||B(6)||B(7)) p.A=1;
        if(B(8)) p.select=1; if(B(9)) p.start=1;
        if(B(12)) p.up=1; if(B(13)) p.down=1; if(B(14)) p.left=1; if(B(15)) p.right=1;
        const x=g.axes[0]||0,y=g.axes[1]||0;
        if(y<-0.5)p.up=1; if(y>0.5)p.down=1; if(x<-0.5)p.left=1; if(x>0.5)p.right=1; }
      src.pad=p; apply();
    };
    addEventListener('gamepadconnected',ev=>{msg.textContent='Controller connected: '+ev.gamepad.id.slice(0,40);});
    let audioT=0, last=0, left=0;
    const pushAudio=()=>{
      if(ac.state!=='running') return;
      const now=ac.currentTime; audioT=audioT||now+0.1;
      if(audioT<now){audioT=now+0.1;return;}
      const b=ac.createBuffer(2,AUDIO_FRAMES,ac.sampleRate), l=b.getChannelData(0), r=b.getChannelData(1);
      for(let i=0;i<AUDIO_FRAMES;i++){l[i]=ab[2*i]*0.5/255;r[i]=ab[2*i+1]*0.5/255;}
      const s=ac.createBufferSource(); s.buffer=b; s.connect(ac.destination); s.start(audioT); audioT+=AUDIO_FRAMES/ac.sampleRate;
    };
    const runUntil=t=>{for(;;){const ev=m._emulator_run_until_f64(e,t);
      if(ev&EV_FRAME) img.data.set(fb);
      if(ev&EV_AUDIO) pushAudio();
      if(ev&EV_TICKS) break;}};
    const raf=ms=>{requestAnimationFrame(raf); pollPad();
      const s=ms/1000, d=Math.min(Math.max(s-(last||s),0),MAX_SEC); last=s;
      const target=m._emulator_get_ticks_f64(e)+d*TICKS_PER_SEC-left;
      runUntil(target); left=(m._emulator_get_ticks_f64(e)-target)|0;
      ctx.putImageData(img,0,0);};
    requestAnimationFrame(raf);
    window.__gb={m,e,ac};
    msg.textContent='Press Enter / Start to play';
  }catch(err){msg.textContent='Failed to start: '+err;console.error(err);}
})();
</script></body></html>
